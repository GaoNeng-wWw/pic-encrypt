name: Build

on:
  workflow_dispatch:
    
  push:
    branches:
      - main

jobs:
  Build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnp
        uses: pnpm/action-setup@v4
        with:
          run_install: true
          version: 10.12.1
      - name: Run Build
        working-directory: site
        run: pnpm build